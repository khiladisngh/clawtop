[project]
site_name = "clawtop"
site_url = "https://khiladisngh.github.io/clawtop/"
site_description = "htop for OpenClaw: gateway memory per agent run, safe kill, and session management."
site_author = "Gishant Singh"
copyright = "&copy; 2026 Gishant Singh. MIT licensed."
repo_url = "https://github.com/khiladisngh/clawtop"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"
# Warnings (broken links and anchors included) abort the build, so CI fails on them.
strict = true

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    { "Install" = "getting-started/install.md" },
    { "Walkthrough video" = "getting-started/walkthrough.md" },
    { "Try it without a gateway" = "getting-started/try-without-a-gateway.md" },
  ] },
  { "Guides" = [
    { "Watch memory" = "guides/watch-memory.md" },
    { "Stop runaway runs" = "guides/stop-runaway-runs.md" },
    { "Manage sessions" = "guides/manage-sessions.md" },
    { "Keep a memory history" = "guides/memory-history.md" },
    { "Harden the gateway" = "guides/harden-the-gateway.md" },
  ] },
  { "Concepts" = "concepts.md" },
  { "Reference" = [
    { "CLI reference" = "reference/cli.md" },
    { "Configuration" = "reference/configuration.md" },
  ] },
  { "Troubleshooting" = "troubleshooting.md" },
]

[project.theme]
features = [
  "navigation.sections",
  "navigation.top",
  "content.code.copy",
  "search.highlight",
]

# Follows the OS setting by default; the header button cycles system -> light -> dark.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# Declaring this table REPLACES Zensical's defaults, so the full default set is listed here
# (copied from `zensical new`); without admonition/details/attr_list the `!!!` blocks render as text.
[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
