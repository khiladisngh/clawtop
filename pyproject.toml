[project]
name = "clawtop"
version = "0.4.1"
description = "htop for OpenClaw: see gateway memory per agent run, kill runaway runs, and manage open sessions."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gishant Singh", email = "khiladisngh@hotmail.com" }]
keywords = ["openclaw", "monitoring", "memory", "wsl", "cli", "typer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.15",
    "rich>=13",
    "textual>=8.2.8",
]

[project.urls]
Homepage = "https://github.com/khiladisngh/clawtop"
Issues = "https://github.com/khiladisngh/clawtop/issues"
Documentation = "https://khiladisngh.github.io/clawtop/"
Changelog = "https://github.com/khiladisngh/clawtop/blob/main/CHANGELOG.md"

[project.scripts]
clawtop = "clawtop.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "zensical>=0.0.71",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
pythonPlatform = "Linux"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["clawtop"]
omit = ["*/__main__.py"]
